<script>
(function () {
  var root = document.querySelector('.m-land');
  if (!root) return;

  // Индикатор прокрутки в навигации
  var bar = root.querySelector('[data-progress]');
  if (bar) {
    var onScroll = function () {
      var h = document.documentElement.scrollHeight - window.innerHeight;
      bar.style.width = (h > 0 ? (window.scrollY / h) * 100 : 0) + '%';
    };
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();
  }

  // Счётчики в блоке статистики
  var counted = new WeakSet();
  var count = function (el) {
    if (counted.has(el)) return;
    counted.add(el);
    var target = parseInt(el.getAttribute('data-count'), 10) || 0;
    var suffix = el.getAttribute('data-suffix') || '';
    var t0 = performance.now();
    var tick = function (t) {
      var p = Math.min(1, (t - t0) / 1100);
      el.textContent = Math.round(target * (1 - Math.pow(1 - p, 3))) + suffix;
      if (p < 1) requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  };
  if ('IntersectionObserver' in window) {
    var io = new IntersectionObserver(function (es) {
      es.forEach(function (e) { if (e.isIntersecting) { count(e.target); io.unobserve(e.target); } });
    }, { threshold: 0.25 });
    root.querySelectorAll('[data-count]').forEach(function (el) { io.observe(el); });
  } else {
    root.querySelectorAll('[data-count]').forEach(count);
  }

  // Фильтры фильмографии
  var btns = root.querySelectorAll('[data-filter]');
  btns.forEach(function (b) {
    b.addEventListener('click', function () {
      var k = b.getAttribute('data-filter');
      btns.forEach(function (o) {
        var on = o === b;
        o.style.background = on ? '#1B2AFF' : 'transparent';
        o.style.borderColor = on ? '#1B2AFF' : 'rgba(255,255,255,.28)';
      });
      root.querySelectorAll('[data-kind]').forEach(function (row) {
        row.style.display = (k === 'all' || row.getAttribute('data-kind') === k) ? '' : 'none';
      });
    });
  });

  // Превью кадра при наведении на строку
  var box = document.createElement('div');
  box.setAttribute('style', 'position:fixed;top:0;left:0;width:320px;height:200px;pointer-events:none;opacity:0;transform:translate3d(-9999px,-9999px,0);transition:opacity .25s ease;z-index:80;box-shadow:0 24px 70px rgba(0,0,0,.7);overflow:hidden');
  var img = document.createElement('img');
  img.setAttribute('style', 'width:100%;height:100%;object-fit:cover');
  img.alt = '';
  box.appendChild(img);
  root.appendChild(box);
  root.addEventListener('mousemove', function (ev) {
    var row = ev.target.closest ? ev.target.closest('[data-still]') : null;
    var src = row && row.getAttribute('data-still');
    if (!src) { box.style.opacity = '0'; return; }
    if (img.getAttribute('src') !== src) img.setAttribute('src', src);
    box.style.opacity = '1';
    box.style.transform = 'translate3d(' + (ev.clientX + 26) + 'px,' + Math.max(70, ev.clientY - 100) + 'px,0)';
  });
  root.addEventListener('mouseleave', function () { box.style.opacity = '0'; });
})();
</script>
